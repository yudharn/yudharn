name: Refresh GitHub stats

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    name: Build assets/github-stats.svg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/make-stats.py

      - name: Commit changes
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/github-stats.svg; then
            echo "Stats card is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git commit -m "profile: refresh GitHub stats [skip ci]"
          git push
