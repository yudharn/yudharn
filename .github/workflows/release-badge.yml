name: Refresh release badge

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    name: Refresh release badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update release badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/make-release-badge.py

      - name: Commit changes
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/badge-release.svg; then
            echo "Release badge is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badge-release.svg
          git commit -m "profile: refresh release badge [skip ci]"
          git push
