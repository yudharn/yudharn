name: Refresh README badges

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    name: Refresh assets/badge-*.svg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate badges
        run: python3 tools/make-badges.py

      - name: Commit changes
        run: |
          set -euo pipefail
          if git diff --quiet -- assets; then
            echo "Badges are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "profile: refresh badges [skip ci]"
          git push
